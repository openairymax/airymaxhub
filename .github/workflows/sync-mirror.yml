name: Sync to GitHub & Gitee
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Sync all repos to mirrors
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GT_TOKEN: ${{ secrets.GT_TOKEN }}
        run: |
          set -e
          # 同步 airymaxhub 自身
          echo "=== airymaxhub ==="
          git remote add github https://x-access-token:${GH_TOKEN}@github.com/openairymax/airymaxhub.git 2>/dev/null || true
          git remote add gitee https://oauth2:${GT_TOKEN}@gitee.com/openairymax/airymaxhub.git 2>/dev/null || true
          git push --all github -q
          git push --tags github -q
          git push --all gitee -q
          git push --tags gitee -q

          # 遍历所有子模块同步
          git submodule foreach --recursive '
            repo=$(basename `pwd`)
            echo "=== $repo ==="

            # 跳过闭源仓库（closed-docs / developbuild 为私有仓，
            # 无公网镜像；docs-closed / memoryrovol / closed-dev-build
            # / build-closed / devbuild-closed 为历史名兜底）
            if [ "$repo" = "closed-docs" ] || [ "$repo" = "closed-dev-build" ] || \
               [ "$repo" = "build-closed" ] || [ "$repo" = "devbuild-closed" ] || \
               [ "$repo" = "developbuild" ] || [ "$repo" = "docs-closed" ] || \
               [ "$repo" = "memoryrovol" ]; then
              echo "  skip (closed source)"
              exit 0
            fi

            # 确保 GitHub 目标仓库存在：镜像 push 到不存在的仓库会报
            # "repository not found" 并以 set -e 中断整条同步链（实测
            # ecosystem/agents 曾在 GitHub 缺失导致镜像停留在旧提交）。
            # 缺失时创建为公开仓库（gh 需 org 创建权限，见 GH_TOKEN scope）。
            if ! gh repo view "openairymax/$repo" >/dev/null 2>&1; then
              if gh repo create "openairymax/$repo" --public --confirm >/dev/null 2>&1; then
                echo "  created missing mirror: openairymax/$repo"
              else
                echo "  warn: cannot create openairymax/$repo, skipping"
                exit 0
              fi
            fi

            # 推送到 GitHub
            git remote add github https://x-access-token:${GH_TOKEN}@github.com/openairymax/$repo.git 2>/dev/null || true
            git remote add gitee https://oauth2:${GT_TOKEN}@gitee.com/openairymax/$repo.git 2>/dev/null || true
            git push --all github -q
            git push --tags github -q
            git push --all gitee -q
            git push --tags gitee -q
            echo "  done"
          '
