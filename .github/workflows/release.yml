name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 三平台并行构建：install 聚合到 stage 后打包 agentrt-<version>.tar.gz，
  # 结构对齐 install.sh 二进制模式（解压后 bin/ 直接可用）。
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: agentrt-linux-x64
            pkg: tar.gz
          - os: macos-latest
            artifact: agentrt-macos-arm64
            pkg: tar.gz
          - os: windows-latest
            artifact: agentrt-windows-x64
            pkg: zip
    runs-on: ${{ matrix.os }}
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libsqlite3-dev libcjson-dev libyaml-dev libcurl4-openssl-dev \
            libssl-dev zlib1g-dev libzstd-dev \
            libmicrohttpd-dev libwebsockets-dev libevent-dev \
            python3 python3-pip

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkgconf sqlite cjson libyaml curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # vcpkg 包名：curl（非 libcurl）、libmicrohttpd/libwebsockets（带 lib- 前缀）
          vcpkg install sqlite3 cjson libyaml curl openssl zlib libmicrohttpd libwebsockets libevent --triplet x64-windows

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S agentrt -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      # openssl/zlib/sqlite 为 keg-only，需显式导出 pkg-config 路径供 find_package 使用
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          cmake -S agentrt -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S agentrt -B ${{ env.BUILD_DIR }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=OFF `
            -DENABLE_SANITIZERS=OFF `
            -DAIRY_BUILD_ALL=ON `
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      # install.sh 二进制模式依赖 bin/agentrt-bootstrap.sh（daemon 编排脚本），
      # 但其位于 devtools 子仓（非 agentrt 树），cmake --install 不会带入，
      # 必须在此显式部署，否则二进制安装后 daemon 无法一键启动编排。
      - name: Deploy bootstrap script (tar.gz platforms)
        if: runner.os != 'Windows'
        run: |
          if [ -f "devtools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "devtools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      # 打包：包内建 agentrt-<version> 顶层目录。install.sh/install.ps1 二进制
      # 模式按 agentrt-* 目录名匹配解压位置，无顶层目录时二进制安装 100% 失败
      # （回退源码构建 / 静默空装）。同时内置运行时配置模板供二进制模式
      # init_secrets 生成 secrets.env/agentrt.yaml/model.yaml。
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ github.ref_name }}"; VERSION="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION}"
          mkdir -p "${PKG_DIR}/config"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/"
          cp -f ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f devtools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          tar -czf ${{ matrix.artifact }}.tar.gz -C pkg .

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          $pkgDir = "pkg\agentrt-$VERSION"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          Copy-Item -Path "${{ env.STAGE_DIR }}\*" -Destination "$pkgDir\" -Recurse -Force
          Compress-Archive -Path "pkg\*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  # 汇聚三平台制品到 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AgentRT ${{ github.ref_name }}
          body: |
            ## AgentRT ${{ github.ref_name }}

            AI Agent Runtime Platform Engineering — 服务器就绪的 Agent 运行时底座。

            ### 安装

            ```sh
            AIRY_RELEASE_URL=<this-release-tarball-url> ./install.sh
            ```

            或直接解压 tarball 后：
            - `bin/agentrt-bootstrap.sh start` 一键启动 17 个 daemon
            - `bin/airy_cli` 进入 CLI 交互界面（或 `airymaxrt`）
          files: dist/*
          draft: true
