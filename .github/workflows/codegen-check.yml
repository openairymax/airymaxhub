name: Codegen SSoT drift check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syscall-codegen-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # 修复两点：
      #   1. submodules:true 全量递归检出必失败（闭源子模块在 GitHub
      #      不存在 + shallow 子模块 SHA 不匹配陷阱）；
      #   2. 旧路径 agentrt/ 为拆分前布局，实际位于 agent-workload/agentrt/
      #      （atoms 为 GitHub 私有仓，init 脚本经 GH_TOKEN insteadOf 认证）。
      - name: Init submodules (agent-workload)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload

      # P2-3: syscall.xml（SSoT）与生成产物 syscall_ids.h / syscall_table_gen.h
      # 一致性校验。生成器仅依赖 python3 标准库，无需编译环境即可运行。
      # 任一生成产物与 SSoT 漂移即返回非零，阻止合入。
      - name: Verify syscall.xml SSoT drift (agentrt userland syscall)
        run: |
          python3 agent-workload/agentrt/tools/codegen/syscall_gen.py \
            --input agent-workload/agentrt/atoms/syscall/include/syscall.xml \
            --output-dir agent-workload/agentrt/atoms/syscall/include \
            --check
